[package]
name = "termtheme"
version = "0.2.0"
edition = "2024"
description = "Light/dark plumbing for ratatui + syntect TUIs: OSC 11 background detection, mode 2031 color-scheme notifications, theme resolution, and a [theme] config section."
license = "MIT"
repository = "https://github.com/worldnine/termtheme"
keywords = ["tui", "terminal", "theme", "dark-mode", "syntect"]
categories = ["command-line-interface"]

# 版はこのクレートに乗り換えるアプリにそろえる（型がそろわないと乗り換えられない）。
[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
ratatui = { version = "0.30", default-features = false }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3.17"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
tempfile = "3"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
